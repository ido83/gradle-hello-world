name: E.T phone home
on:
  push:
    branches:
      - test
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build with Gradle and automatically increment version
        run: ./gradlew build

      - name: Use Easy Versioning to increment version
        id: versioning
        uses: Langsdorf/easy-versioning@v1.0.1
        with:
          input: '0.0.1'
          increment: patch

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: matankaufman/helloworld:${{ steps.versioning.outputs.version }}