name: DevSecOps CI Pipeline

on:
  push:
    branches: [ master, feature/* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Dynamic Patch Version
        id: versioning
        run: |
          PATCH_NUM="${{ github.run_number }}"
          FULL_VERSION="1.0.${PATCH_NUM}"
          echo "VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "Calculated Version: ${FULL_VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Fat JAR with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew shadowJar -Pversion=${{ env.VERSION }} --no-daemon

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ env.VERSION }}
          path: build/libs/*.jar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gradle-hello-world:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gradle-hello-world:latest

      - name: Pull and Run Container Verification
        run: |
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/gradle-hello-world:${{ env.VERSION }}"
          echo "Pulling image: $IMAGE_URI"
          docker pull "$IMAGE_URI"
          echo "Running container test..."
          docker run --rm "$IMAGE_URI"

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/gradle-hello-world:${{ env.VERSION }}'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ env.VERSION }}
          path: sbom-cyclonedx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Sign Docker Image with Cosign
        run: |
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/gradle-hello-world:${{ env.VERSION }}"
          echo "Signing $IMAGE_URI..."
          cosign sign --yes "$IMAGE_URI"
